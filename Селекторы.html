<!--Создал HTML-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selectors</title>
    <style>
     /* Internal*/
        h1 {
        color: #550;
    }
    </style>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!--Добавил заголовок и селектор по id -->
<div id = "header"> <h1> Заголовок 1 </h1> </div>
    <!--Добавил абзац и селектор по тегу-->
    <p>Абзац</p>
    <!--Добавил элемент списка и селектор по классу-->
    <ul>
    <li class= "Lists"> Элемент списка</li>
    </ul>
    <!--Inline-->
    <p style="color: red;">Абзац</p>
    
<!--При использовании селектора по id и стиля Internal, результат показал что "Заголовок" закрасился в зеленый цвет стиля Internal-->
<!--При использовании селектора по тегу и стиля Inline, результат показал что "Абзац" продублировался для каждого цвета-->
<!--При использовании селектора по классу и стиля External, результат показал что шрифт "Элемента списка" стал тонким при конфликте стиля и селектора-->
</body>
</html>
