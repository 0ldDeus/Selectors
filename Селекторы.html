<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Работа с селекторами</title>
    <style>
        /* Задание 1: Работа с базовыми селекторами */

        /* Селектор по тегу */
        p {
            color: blue; /* Все абзацы будут синими */
        }

        /* Селектор по классу */
        .bold {
            font-weight: bold; /* Элементы списка с классом 'bold' будут жирными */
        }

        /* Селектор по ID */
        #red-title {
            color: red; /* Заголовок с ID 'red-title' будет красным */
        }

        /* Задание 2: Приоритет селекторов */

        /* Конфликтующие стили */
        h2 {
            color: green; /* Цвет заголовка по тегу */
        }
        .important {
            color: orange; /* Цвет заголовка по классу */
        }
        #priority-title {
            color: purple; /* Цвет заголовка по ID */
        }
    </style>
</head>
<body>
    <!-- Задание 1: Примеры базовых селекторов -->
    <h1 id="red-title">Заголовок h1 с ID</h1> <!-- Селектор ID -->
    <h2 class="important" id="priority-title">Заголовок h2 с конфликтующими стилями</h2>
    <p>Абзац с селектором по тегу</p> <!-- Селектор по тегу -->
    <ul>
        <li class="bold">Элемент списка с классом 'bold'</li> <!-- Селектор по классу -->
        <li>Обычный элемент списка</li>
    </ul>

    <!-- Задание 2: Комментарий к приоритету селекторов -->
    <!-- Здесь демонстрируется, что для h2 с ID 'priority-title' применяется фиолетовый цвет (ID имеет наивысший приоритет). -->
</body>
</html>
